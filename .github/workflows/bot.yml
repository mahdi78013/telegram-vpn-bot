name: 24/7 Auto VPN Bot

on:
  schedule:
    # هر ۴ ساعت یکبار بررسی و تمدید خودکار
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: bot-running-group
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot Daemon
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || '8857298539:AAFuXPQnvUEQfuWrbAaXJW7jiAnhN9kWMAo' }}
          ADMIN_ID: ${{ secrets.ADMIN_ID || '748538264' }}
          DEFAULT_TAG: ${{ secrets.DEFAULT_TAG || '@Internet_azad369' }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: 1
        run: |
          python bot.py
